name: Publish CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SCYNC_GOOGLE_CLIENT_ID: ${{ secrets.SCYNC_GOOGLE_CLIENT_ID }}
          SCYNC_GOOGLE_CLIENT_SECRET: ${{ secrets.SCYNC_GOOGLE_CLIENT_SECRET }}

      - run: npm run verify:google-client

      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ github.event.inputs.tag || 'next' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
